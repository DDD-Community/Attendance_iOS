# TestFlight "테스트할 사항" 문구.
# 배포마다 직접 쓰지 않아도 되도록 커밋 제목에서 작업 성격을 판별해 문구를 고른다.
# 같은 성격이라도 매번 같은 문장이 나오지 않게 카테고리마다 여러 개를 두고
# 빌드번호(YYMMDDHHMM)로 순환한다.
#
# keywords 는 커밋 제목을 소문자로 바꿔 부분 일치로 본다. 위에서부터 먼저 걸리는 것을 쓴다.
# 순서가 곧 우선순위다. design 을 fix 위에 둔 이유는
# "디자인 수정" 같은 제목이 fix 로 빠지지 않게 하기 위해서다.
categories:
  - id: design
    keywords: [design, 디자인, ui, 스타일, 컴포넌트]
    notes:
      - "디자인 시스템 변경했어요!"
      - "화면 디자인을 다듬었어요."
      - "UI를 조금 손봤어요!"

  - id: feature
    keywords: [feat, 기능, 추가, 신규]
    notes:
      - "새 기능이 들어갔어요!"
      - "기능을 하나 추가했어요."
      - "새로 만든 화면이 있어요!"

  - id: performance
    keywords: [perf, 성능, 최적화, 속도]
    notes:
      - "속도를 개선했어요!"
      - "더 빠르게 돌도록 손봤어요."

  - id: fix
    keywords: [fix, 수정, 오류, 버그, 해결, 안정화]
    notes:
      - "안정화 했어요!"
      - "동작이 이상하던 부분을 고쳤어요."
      - "버그를 잡았어요!"

  - id: refactor
    keywords: [refactor, chore, 정리, 리팩터, 리팩토링, 의존성]
    notes:
      - "내부 구조를 정리했어요."
      - "코드 정리 작업을 했어요!"

  # 위 어디에도 안 걸릴 때 쓴다.
  - id: default
    keywords: []
    notes:
      - "이번에도 조금씩 나아졌어요!"
      - "자잘한 개선이 들어갔어요."

# App Store "새로운 기능" 문구.
# release 브랜치 배포 시 현재 앱 버전을 넣고 버전별로 한 문구를 안정적으로 선택한다.
# 같은 버전을 재배포하거나 심사 제출해도 동일한 문구를 사용한다.
app_store:
  ko:
    - |-
      [v %{version}]
      [개선 사항]
      - 앱 안정성과 전반적인 사용성을 개선했어요.
      - 발견된 오류를 수정했어요.
    - |-
      [v %{version}]
      [개선 사항]
      - 더 안정적으로 사용할 수 있도록 앱을 다듬었어요.
      - 사용 중 불편했던 부분을 개선했어요.
    - |-
      [v %{version}]
      [개선 사항]
      - 앱 성능과 안정성을 개선했어요.
      - 더욱 원활한 사용을 위해 세부 기능을 정리했어요.
    - |-
      [v %{version}]
      [개선 사항]
      - 전반적인 사용 경험을 개선했어요.
      - 기타 사소한 오류를 수정했어요.

  en-US:
    - |-
      [v %{version}]
      [Improvements]
      - Improved overall app stability and usability.
      - Fixed known issues.
    - |-
      [v %{version}]
      [Improvements]
      - Refined the app for a more reliable experience.
      - Improved areas that could be inconvenient during use.
    - |-
      [v %{version}]
      [Improvements]
      - Improved app performance and stability.
      - Refined details for a smoother experience.
    - |-
      [v %{version}]
      [Improvements]
      - Improved the overall user experience.
      - Fixed other minor issues.
