version: 2.1

# develop 브랜치에 머지/푸시되면 CircleCI가 자동으로
# DDDAttendance-Stage 빌드 → TestFlight 업로드를 수행합니다.
#
# 비밀정보(.env / 인증서 / 키 / Config xcconfig / Matchfile / Fastfile)는
# 이 PUBLIC 레포에 두지 않고, 빌드 중 비공개 레포(Roy-wonji/Attendance-iOS-Config)에서
# 받아와 주입합니다. (인증: CircleCI 환경변수 CONFIG_REPO_TOKEN = GitHub PAT)

parameters:
  xcode-version:
    type: string
    default: "16.1.0"

jobs:
  testflight-stage:
    macos:
      xcode: << pipeline.parameters.xcode-version >>
    resource_class: m2pro.medium
    environment:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      HOMEBREW_NO_AUTO_UPDATE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
    steps:
      - checkout

      # 비공개 Config 레포에서 CI 자산 주입 (secret은 메인 레포에 없음)
      - run:
          name: 비공개 Config 레포에서 CI 자산 받아오기
          command: |
            git clone --depth 1 \
              "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/Attendance-iOS-Config.git" /tmp/cfg
            mkdir -p Config fastlane
            cp /tmp/cfg/Config/*.xcconfig Config/
            cp /tmp/cfg/fastlane/.env       fastlane/.env
            cp /tmp/cfg/fastlane/Matchfile  fastlane/Matchfile
            cp /tmp/cfg/fastlane/Fastfile   fastlane/Fastfile
            echo "✅ CI 자산 주입 완료"

      - run:
          name: mise + Tuist 설치
          command: |
            curl https://mise.run | sh
            echo 'eval "$(~/.local/bin/mise activate bash)"' >> "$BASH_ENV"
            source "$BASH_ENV"
            mise install
            mise exec -- tuist version

      - restore_cache:
          keys:
            - v1-tuist-{{ checksum "Tuist/Package.resolved" }}
            - v1-tuist-

      - run:
          name: Tuist 의존성 설치 & 프로젝트 생성
          command: |
            source "$BASH_ENV"
            mise exec -- tuist install
            mise exec -- tuist generate --no-open

      - save_cache:
          key: v1-tuist-{{ checksum "Tuist/Package.resolved" }}
          paths:
            - ~/.cache/tuist
            - Tuist/.build

      - run:
          name: Bundler(fastlane) 설치
          command: |
            bundle config set --local path vendor/bundle
            bundle install --jobs 4 --retry 3

      # 배포 계획 등록 (CircleCI Releases) — 앱 버전을 소스에서 추출
      - run:
          name: 배포 계획(Plan a deploy)
          command: |
            VERSION=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' \
              Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift \
              | grep -oE '[0-9.]+' | head -1)
            VERSION=${VERSION:-0.0.0}
            echo "target version: $VERSION"
            circleci run release plan \
              --environment-name="TestFlight" \
              --component-name="DDDAttendance-Stage" \
              --target-version="$VERSION"

      - run:
          name: Fastlane QA — Stage 빌드 & TestFlight 업로드
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            bundle exec fastlane QA

      # 배포 결과 보고 (CircleCI Releases)
      - run:
          name: 배포 성공 보고(SUCCESS)
          command: circleci run release update --status=SUCCESS
          when: on_success

      - run:
          name: 배포 실패 보고(FAILED)
          command: circleci run release update --status=FAILED
          when: on_fail

      - store_artifacts:
          path: fastlane/output
          destination: fastlane-output

workflows:
  stage-testflight:
    jobs:
      - testflight-stage:
          filters:
            branches:
              only:
                - develop
