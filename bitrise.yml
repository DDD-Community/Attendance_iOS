---
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
format_version: "26"
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-26.3.x

app:
  envs:
    - CONFIG_REPO: Roy-wonji/Attendance-iOS-Config
    - TUIST_VERSION: 4.154.0
    - REPO: DDD-Community/Attendance_iOS

# Starter 플랜은 Pipelines 미지원 → trigger_map + 단일 workflow 구조
trigger_map:
  - push_branch: develop
    workflow: deploy-stg
  - push_branch: "release-stg-*"
    workflow: deploy-stg
  - tag: "v*"
    workflow: deploy-live
  - pull_request_target_branch: "*"
    workflow: run-tests

workflows:
  # ── PR 유닛 테스트 ─────────────────────────────────────────────────
  run-tests:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: 비밀 자산 주입 (Config repo)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
                mkdir -p Config fastlane
                cp /tmp/cfg/Config/*.xcconfig Config/
                cp /tmp/cfg/fastlane/.env fastlane/.env
                mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
      - restore-cache@3:
          inputs:
            - key: |-
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}
                deps-{{ .OS }}-{{ .Arch }}
      - script@1:
          title: Tuist 설치 + 프로젝트 생성
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euxo pipefail
                curl -fsSL https://mise.run | sh
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                mise install "tuist@${TUIST_VERSION}"
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift install
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift generate
      - save-cache@1:
          inputs:
            - key: deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
            - paths: |-
                $HOME/.local/bin
                $HOME/.local/share/mise
                $HOME/.cache/mise
                $HOME/.cache/tuist
                $HOME/Library/Caches/org.swift.swiftpm
                $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
      - script@1:
          title: Tuist test
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euxo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift test --result-bundle-path TestResults.xcresult
      - script@1:
          title: PR 테스트 결과 코멘트 (커버리지 + 실패목록)
          is_always_run: true
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -uo pipefail
                PR="${BITRISE_PULL_REQUEST:-}"
                if [ -z "$PR" ]; then echo "PR 빌드 아님 → 코멘트 스킵"; exit 0; fi
                TOKEN="${CONFIG_REPO_TOKEN:-}"
                if [ -z "$TOKEN" ]; then echo "토큰 없음 → 코멘트 스킵"; exit 0; fi
                export XR="TestResults.xcresult"
                export MARKER="<!-- ios-test-bot -->"

                COV="N/A"
                if [ -d "$XR" ]; then
                  COV=$(xcrun xccov view --report --json "$XR" 2>/dev/null | python3 -c "import sys,json;print('%.1f%%'%(json.load(sys.stdin)['lineCoverage']*100))" 2>/dev/null || echo "N/A")
                fi

                FAILS=""
                if [ -d "$XR" ]; then
                  printf '%s\n' 'import sys,json' 'bt=chr(96)' 'd=json.load(sys.stdin)' 'o=[]' 'st=list(d.get("testNodes",[]))' 'while st:' ' n=st.pop()' ' st+=(n.get("children",[]) or [])' ' if n.get("nodeType")=="Test Case" and n.get("result")=="Failed":' '  m=[c.get("name","") for c in n.get("children",[]) if c.get("nodeType")=="Failure Message"]' '  o.append("- "+bt+n.get("name","")+bt+((" — "+" / ".join(m))[:300] if m else ""))' 'print(chr(10).join(o[:20]))' > /tmp/fails.py
                  FAILS=$(xcrun xcresulttool get test-results tests --path "$XR" 2>/dev/null | python3 /tmp/fails.py 2>/dev/null || echo "")
                fi

                if [ -z "$FAILS" ]; then STATUS="**✅ 전체 통과**"; else STATUS="**❌ 실패 있음**"; fi
                BODY="$MARKER
                ## 🧪 iOS 테스트 · Build #${BITRISE_BUILD_NUMBER}
                $STATUS · 📊 라인 커버리지 **$COV**"
                if [ -n "$FAILS" ]; then BODY="$BODY

                ### 실패
                $FAILS"; fi
                BODY="$BODY

                [🔗 빌드 로그]($BITRISE_BUILD_URL)"
                export BODY
                JSON=$(python3 -c "import json,os;print(json.dumps({'body':os.environ['BODY']}))")
                API="https://api.github.com/repos/$REPO"
                AUTH="Authorization: Bearer $TOKEN"
                ACC="Accept: application/vnd.github+json"
                ID=$(curl -s -H "$AUTH" -H "$ACC" "$API/issues/$PR/comments?per_page=100" | python3 -c "import sys,json,os;m=os.environ['MARKER'];d=json.load(sys.stdin);cs=d if isinstance(d,list) else [];print(next((str(c['id']) for c in cs if m in (c.get('body') or '')),''))" 2>/dev/null || echo "")
                if [ -n "$ID" ]; then
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH -H "$AUTH" -H "$ACC" "$API/issues/comments/$ID" -d "$JSON")
                else
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH" -H "$ACC" "$API/issues/$PR/comments" -d "$JSON")
                fi
                echo "PR 코멘트 status=$CODE"
      - deploy-to-bitrise-io@2: {}

  # ── Stage → TestFlight (develop / release-stg-* push) ───────────────
  deploy-stg:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: 비밀 자산 주입 (Config repo + Match)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
                mkdir -p Config fastlane
                cp /tmp/cfg/Config/*.xcconfig Config/
                cp /tmp/cfg/fastlane/.env       fastlane/.env
                mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
                envman add --key MATCH_GIT_URL --value "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git"
      - restore-cache@3:
          inputs:
            - key: |-
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}
                deps-{{ .OS }}-{{ .Arch }}
      - script@1:
          title: Tuist 설치 + 프로젝트 생성
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euxo pipefail
                curl -fsSL https://mise.run | sh
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                mise install "tuist@${TUIST_VERSION}"
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift install
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift generate
                ls -d *.xcworkspace
      - save-cache@1:
          inputs:
            - key: deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
            - paths: |-
                $HOME/.local/bin
                $HOME/.local/share/mise
                $HOME/.cache/mise
                $HOME/.cache/tuist
                $HOME/Library/Caches/org.swift.swiftpm
                $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
      - script@1:
          title: 릴리스 노트 수집
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -e
                EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
                VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
                BODY=$(sed -E '/^\[[vV] ?[0-9.]+\]/d' fastlane/metadata/ko/release_notes.txt 2>/dev/null | sed '/./,$!d')
                [ -z "$BODY" ] && BODY="- 버그 수정"
                envman add --key RELEASE_NOTES --value "[v${VER}]
                ${BODY}"
      - script@1:
          title: Discord 빌드 시작 알림
          inputs:
            - content: |
                #!/usr/bin/env bash
                python3 - <<'PY'
                import os, json, urllib.request
                msg = f"🛠️ **DDDAttendance** TestFlight(QA) 빌드 시작 · #{os.environ.get('BITRISE_BUILD_NUMBER','')}\n{os.environ.get('BITRISE_BUILD_URL','')}"
                wh = os.environ.get('DISCORD_WEBHOOK','')
                if wh:
                    req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(), headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
                    try: urllib.request.urlopen(req); print("discord ok")
                    except Exception as e: print("discord skip:", e)
                PY
      - restore-cache@3:
          title: Gem 캐시 복원
          inputs:
            - key: |-
                gems-{{ .OS }}-{{ .Arch }}-{{ checksum "Gemfile.lock" }}
                gems-{{ .OS }}-{{ .Arch }}
      - script@1:
          title: Gem 설치 (bundle install)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                bundle config set --local path vendor/bundle
                bundle install
      - save-cache@1:
          title: Gem 캐시 저장
          inputs:
            - key: gems-{{ .OS }}-{{ .Arch }}-{{ checksum "Gemfile.lock" }}
            - paths: vendor/bundle
      - script@1:
          title: Fastlane QA — Stage → TestFlight
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                bundle exec fastlane ios QA
                mkdir -p "$BITRISE_DEPLOY_DIR"
                cp -f fastlane/output/*.ipa "$BITRISE_DEPLOY_DIR/" 2>/dev/null || true
      - script@1:
          title: Discord 성공 알림 (멘션 + 릴리스 노트)
          inputs:
            - content: |
                #!/usr/bin/env bash
                python3 - <<'PY'
                import os, json, urllib.request
                msg = "@hoker9494 @loveyourfamily\n"
                msg += f"✅ **attendance-iOS** TestFlight 배포 완료 · #{os.environ.get('BITRISE_BUILD_NUMBER','')}"
                notes = os.environ.get('RELEASE_NOTES','').strip()
                if notes: msg += "\n" + notes
                msg += "\n🔗 TestFlight: https://testflight.apple.com/join/WbTjTcmF"
                url = os.environ.get('BITRISE_BUILD_URL','')
                if url: msg += "\n" + url
                wh = os.environ.get('DISCORD_WEBHOOK','')
                if wh:
                    req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(), headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
                    try: urllib.request.urlopen(req); print("discord ok")
                    except Exception as e: print("discord skip:", e)
                PY
      - deploy-to-bitrise-io@2: {}

  # ── Prod → App Store (v* 태그) ─────────────────────────────────────
  deploy-live:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: 비밀 자산 주입 (Config repo + Match)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
                mkdir -p Config fastlane
                cp /tmp/cfg/Config/*.xcconfig Config/
                cp /tmp/cfg/fastlane/.env       fastlane/.env
                mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
                envman add --key MATCH_GIT_URL --value "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git"
      - script@1:
          title: 릴리스 버전 추출
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
                VER="${BITRISE_GIT_TAG#v}"
                if [ -z "$VER" ]; then
                  VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
                fi
                envman add --key RELEASE_VERSION --value "$VER"
                echo "📦 릴리스 버전: ${VER}"
      - restore-cache@3:
          inputs:
            - key: |-
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
                deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}
                deps-{{ .OS }}-{{ .Arch }}
      - script@1:
          title: Tuist 설치 + 프로젝트 생성
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euxo pipefail
                curl -fsSL https://mise.run | sh
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                mise install "tuist@${TUIST_VERSION}"
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift install
                mise exec "tuist@${TUIST_VERSION}" -- swift TuistTool.swift generate
                ls -d *.xcworkspace
      - save-cache@1:
          inputs:
            - key: deps-{{ .OS }}-{{ .Arch }}-{{ checksum ".mise.toml" }}-{{ checksum "Tuist/Package.resolved" }}
            - paths: |-
                $HOME/.local/bin
                $HOME/.local/share/mise
                $HOME/.cache/mise
                $HOME/.cache/tuist
                $HOME/Library/Caches/org.swift.swiftpm
                $HOME/Library/Developer/Xcode/DerivedData/**/SourcePackages
      - script@1:
          title: Discord 빌드 시작 알림
          inputs:
            - content: |
                #!/usr/bin/env bash
                python3 - <<'PY'
                import os, json, urllib.request
                msg = f"🚀 **DDDAttendance** App Store(Prod) 빌드 시작 · {os.environ.get('RELEASE_VERSION','')} · #{os.environ.get('BITRISE_BUILD_NUMBER','')}\n{os.environ.get('BITRISE_BUILD_URL','')}"
                wh = os.environ.get('DISCORD_WEBHOOK','')
                if wh:
                    req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(), headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
                    try: urllib.request.urlopen(req); print("discord ok")
                    except Exception as e: print("discord skip:", e)
                PY
      - restore-cache@3:
          title: Gem 캐시 복원
          inputs:
            - key: |-
                gems-{{ .OS }}-{{ .Arch }}-{{ checksum "Gemfile.lock" }}
                gems-{{ .OS }}-{{ .Arch }}
      - script@1:
          title: Gem 설치 (bundle install)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                bundle config set --local path vendor/bundle
                bundle install
      - save-cache@1:
          title: Gem 캐시 저장
          inputs:
            - key: gems-{{ .OS }}-{{ .Arch }}-{{ checksum "Gemfile.lock" }}
            - paths: vendor/bundle
      - script@1:
          title: Fastlane release — Prod → App Store
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -euo pipefail
                export PATH="$HOME/.local/bin:$PATH"
                eval "$(mise activate bash)"
                bundle exec fastlane ios release version:$RELEASE_VERSION
                mkdir -p "$BITRISE_DEPLOY_DIR"
                cp -f fastlane/output/*.ipa "$BITRISE_DEPLOY_DIR/" 2>/dev/null || true
      - script@1:
          title: GitHub Release 생성/갱신 (latest)
          inputs:
            - content: |
                #!/usr/bin/env bash
                set -uo pipefail
                TOKEN="${CONFIG_REPO_TOKEN:-}"
                TAG="${BITRISE_GIT_TAG:-}"
                if [ -z "$TOKEN" ] || [ -z "$TAG" ]; then echo "토큰/태그 없음 → GitHub Release 스킵"; exit 0; fi

                # 릴리스 노트 본문: [v x.y.z] 헤더 줄 제거, 없으면 기본 문구
                BODY=$(sed -E '/^\[[vV] ?[0-9.]+\]/d' fastlane/metadata/ko/release_notes.txt 2>/dev/null | sed '/./,$!d')
                [ -z "$BODY" ] && BODY="- 버그 수정 및 안정성 개선"
                export TAG BODY
                export RELEASE_VERSION="${RELEASE_VERSION:-$TAG}"
                JSON=$(python3 -c "import json,os;print(json.dumps({'tag_name':os.environ['TAG'],'name':'v'+os.environ['RELEASE_VERSION'],'body':os.environ['BODY'],'draft':False,'prerelease':False,'make_latest':'true'}))")
                API="https://api.github.com/repos/$REPO"
                AUTH="Authorization: Bearer $TOKEN"
                ACC="Accept: application/vnd.github+json"

                # 기존 태그 릴리스 있으면 PATCH, 없으면 POST
                ID=$(curl -s -H "$AUTH" -H "$ACC" "$API/releases/tags/$TAG" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')" 2>/dev/null || echo "")
                if [ -n "$ID" ]; then
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH -H "$AUTH" -H "$ACC" "$API/releases/$ID" -d "$JSON")
                else
                  CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "$AUTH" -H "$ACC" "$API/releases" -d "$JSON")
                fi
                echo "GitHub Release status=$CODE (tag=$TAG)"
      - script@1:
          title: Discord 성공 알림
          inputs:
            - content: |
                #!/usr/bin/env bash
                python3 - <<'PY'
                import os, json, urllib.request
                msg = f"🚀 **DDDAttendance** {os.environ.get('RELEASE_VERSION','')} App Store 제출 완료 · #{os.environ.get('BITRISE_BUILD_NUMBER','')}"
                url = os.environ.get('BITRISE_BUILD_URL','')
                if url: msg += "\n" + url
                wh = os.environ.get('DISCORD_WEBHOOK','')
                if wh:
                    req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(), headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
                    try: urllib.request.urlopen(req); print("discord ok")
                    except Exception as e: print("discord skip:", e)
                PY
      - deploy-to-bitrise-io@2: {}
