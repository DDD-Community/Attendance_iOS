workflows:
  deploy-stg:
    name: Stage → TestFlight
    cache:
      cache_paths:
        - $HOME/.local/share/mise
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.cache/tuist
        - $CM_BUILD_DIR/Tuist/.build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.3"
      vars:
        CONFIG_REPO: "Roy-wonji/Attendance-iOS-Config"
        TUIST_VERSION: "4.180.0"
      groups:
        - attendance   # Codemagic에 CONFIG_REPO_TOKEN, DISCORD_WEBHOOK 등록
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "release-stg-*"
          include: true
    scripts:
      - name: 비밀 자산 주입 + Tuist(make) generate
        script: |
          set -e
          # 비공개 Config 레포에서 .env / Config(xcconfig)만 복원
          # Fastfile/Matchfile/Appfile은 메인 레포에 추적된 최신본을 그대로 사용 (덮어쓰지 않음)
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env       fastlane/.env
          mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
          # match 인증서 레포를 SSH 대신 토큰 HTTPS로 clone (Codemagic엔 SSH키 없음)
          echo "MATCH_GIT_URL=https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git" >> "$CM_ENV"
          # 빌드번호는 Fastfile QA 레인이 App Store 최신 빌드+1로 자동 증가시킴
          # mise + tuist + make generate
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          chmod +x ./make
          # 캐시에 남은 깨진 매크로 모듈(CasePathsMacrosSupport) 제거 후 클린 재생성
          rm -rf ~/Library/Developer/Xcode/DerivedData/DDDAttendance-* 2>/dev/null || true
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist clean && ./make install && ./make generate'
          ls -d *.xcworkspace
      - name: 릴리스 노트 수집 ([v버전] 코드 추출 + ko metadata 본문)
        script: |
          # 버전은 코드(appVersion)에서 추출, 본문은 metadata/ko/release_notes.txt (기존 [v...] 줄은 제거)
          EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
          VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          BODY=$(sed -E '/^\[v ?[0-9.]+\]/d' fastlane/metadata/ko/release_notes.txt 2>/dev/null | sed '/./,$!d')
          [ -z "$BODY" ] && BODY="- 버그 수정"
          NOTES="[v${VER}]
          ${BODY}"
          echo "RELEASE_NOTES<<__EOF__" >> "$CM_ENV"
          echo "$NOTES" >> "$CM_ENV"
          echo "__EOF__" >> "$CM_ENV"
          echo "릴리스 노트(ko):"; echo "$NOTES"
          echo "릴리스 노트:"; echo "$NOTES"
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🛠️ **DDDAttendance** TestFlight(QA) 빌드 시작 · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: Fastlane QA — Stage → TestFlight
        script: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          bundle install
          bundle exec fastlane ios QA
      - name: Discord 성공 알림 (멘션 + 릴리스 노트)
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = "@hoker9494 @loveyourfamily\n"
          msg += f"✅ **attendance-iOS** TestFlight 배포 완료 · #{os.environ.get('BUILD_NUMBER','')}"
          notes = os.environ.get('RELEASE_NOTES','').strip()
          if notes: msg += "\n" + notes
          msg += "\n🔗 TestFlight: https://testflight.apple.com/join/WbTjTcmF"
          url = os.environ.get('CM_BUILD_URL','')
          if url: msg += "\n" + url
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY

  test:
    name: PR 유닛 테스트
    cache:
      cache_paths:
        - $HOME/.local/share/mise
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.cache/tuist
        - $CM_BUILD_DIR/Tuist/.build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: "26.3"
      vars:
        CONFIG_REPO: "Roy-wonji/Attendance-iOS-Config"
        TUIST_VERSION: "4.180.0"
      groups:
        - attendance
    triggering:
      events:
        - pull_request
    scripts:
      - name: 자산 주입 + generate + 유닛 테스트
        script: |
          set -e
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env fastlane/.env
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          chmod +x ./make
          rm -rf ~/Library/Developer/Xcode/DerivedData/DDDAttendance-* 2>/dev/null || true
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist clean && ./make install && ./make generate'
          mise exec "tuist@${TUIST_VERSION}" -- tuist test

  deploy-prod:
    name: Prod → App Store
    cache:
      cache_paths:
        - $HOME/.local/share/mise
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/.cache/tuist
        - $CM_BUILD_DIR/Tuist/.build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: "26.3"
      vars:
        CONFIG_REPO: "Roy-wonji/Attendance-iOS-Config"
        TUIST_VERSION: "4.180.0"
      groups:
        - attendance
    triggering:
      # 실제 App Store 제출(submit_for_review)이라 v* 태그로만 트리거 (release 브랜치 push 자동 트리거 보류)
      # release 브랜치로도 돌리려면 아래 push/branch_patterns 주석 해제
      events:
        # - push
        - tag
      # branch_patterns:
      #   - pattern: "release"
      #     include: true
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: 비밀 자산 주입 + 릴리스 버전 + Tuist(make) generate
        script: |
          set -e
          # .env / xcconfig만 복원, Fastfile/Matchfile은 메인 레포 최신본 사용
          git clone --depth 1 "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/${CONFIG_REPO}.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env       fastlane/.env
          mkdir -p Projects/App/Resources && cp /tmp/cfg/App/GoogleService-Info.plist Projects/App/Resources/GoogleService-Info.plist
          echo "MATCH_GIT_URL=https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/FastlaneMatch.git" >> "$CM_ENV"
          # 릴리스 버전: 태그(v1.2.3)에서 추출, 없으면 appVersion에서 (빌드번호는 Fastfile이 자동 증가)
          EXT="Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift"
          VER="${CM_TAG#v}"
          if [ -z "$VER" ]; then
            VER=$(grep -oE 'appVersion\(version: String = "[0-9.]+"' "$EXT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          fi
          echo "RELEASE_VERSION=$VER" >> "$CM_ENV"
          echo "📦 릴리스 버전: ${VER}"
          curl -fsSL https://mise.run | sh
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          mise install "tuist@${TUIST_VERSION}"
          chmod +x ./make
          # 캐시에 남은 깨진 매크로 모듈(CasePathsMacrosSupport) 제거 후 클린 재생성
          rm -rf ~/Library/Developer/Xcode/DerivedData/DDDAttendance-* 2>/dev/null || true
          mise exec "tuist@${TUIST_VERSION}" -- bash -c 'tuist clean && ./make install && ./make generate'
          ls -d *.xcworkspace
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🚀 **DDDAttendance** App Store(Prod) 빌드 시작 · {os.environ.get('RELEASE_VERSION','')} · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: Fastlane release — Prod → App Store
        script: |
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(mise activate bash)"
          bundle install
          bundle exec fastlane ios release version:$RELEASE_VERSION
      - name: Discord 성공 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🚀 **DDDAttendance** {os.environ.get('RELEASE_VERSION','')} App Store 제출 완료 · #{os.environ.get('BUILD_NUMBER','')}"
          url = os.environ.get('CM_BUILD_URL','')
          if url: msg += "\n" + url
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"DDDAttendance-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
