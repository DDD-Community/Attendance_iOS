name: iOS Deploy

on:
  push:
    branches: [develop, main]

# 셀프호스티드 러너가 한 대뿐이라 배포는 항상 직렬로 실행한다.
concurrency:
  group: ios-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    # main 머지 시 태그를 푸시하려면 쓰기 권한이 필요하다.
    permissions:
      contents: write
    timeout-minutes: 120

    env:
      APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_KEY_CONTENT_BASE64 }}
      TUIST_CONFIG_TOKEN: ${{ secrets.TUIST_TOKEN }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '600'

    steps:
      - uses: actions/checkout@v4

      # launchd 서비스는 PATH가 최소라 툴체인 경로를 직접 얹어준다.
      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"

      # Config/*.xcconfig 와 GoogleService-Info.plist 는 gitignore 대상이라
      # 체크아웃에 없다. 시크릿에서 복원해야 빌드가 된다.
      - name: Restore gitignored build config
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$CONFIG_TAR" | base64 --decode | tar xzf -
          mkdir -p Projects/App/Resources
          printf '%s' "$GOOGLE_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist
          test -f Config/base.xcconfig
          test -s Projects/App/Resources/GoogleService-Info.plist
          # 복원 파일이 절대 커밋되지 않는지 확인 (gitignore 회귀 방지)
          git check-ignore -q Config/base.xcconfig
          git check-ignore -q Projects/App/Resources/GoogleService-Info.plist

      - name: Install toolchain
        run: |
          # .tool-versions 의 python/node 는 이 빌드에 불필요하고
          # python-precompiled 다운로드가 404 로 실패하므로 tuist 만 설치한다.
          mise install tuist
          bundle install

      - name: Generate Xcode workspace
        run: |
          tuist install
          tuist generate --no-open

      # 앱버전(appVersion)은 수동 관리한다. CI 는 빌드번호(날짜형)만 올린다.
      - name: Read app version
        id: ver
        run: |
          FILE=Plugins/ProjectTemplatePlugin/ProjectDescriptionHelpers/Project+Templete/Extension+String.swift
          VERSION=$(sed -nE 's/.*appVersion\(version: String = "([0-9.]+)"\).*/\1/p' "$FILE" | head -1)
          test -n "$VERSION" || { echo "appVersion 추출 실패: $FILE"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "앱버전: $VERSION"

      # develop 푸시 → TestFlight
      - name: Deploy to TestFlight
        if: github.ref_name == 'develop'
        run: |
          RELEASE_NOTES="$(git log -1 --pretty=%s)" bundle exec fastlane ios QA

      # main 머지 → 태그 갱신
      # GITHUB_TOKEN 으로 푸시하면 워크플로우가 재트리거되지 않아 중복 배포가 없다.
      - name: Update release tag
        if: github.ref_name == 'main'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$VERSION"
          git push -f origin "refs/tags/$VERSION"
          echo "태그 갱신: $VERSION"

      # main 머지 → App Store 업로드 + 심사 제출
      - name: Deploy to App Store
        if: github.ref_name == 'main'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          bundle exec fastlane ios release
          bundle exec fastlane ios submit_for_review version:"$VERSION"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.run_id }}
          path: |
            fastlane/output/*.ipa
            fastlane/output/*.dSYM.zip
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 7
