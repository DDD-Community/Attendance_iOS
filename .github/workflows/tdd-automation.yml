name: 🤖 TDD 자동화 CI

on:
  push:
    branches: [ develop, main ]
    paths:
      - 'Projects/Domain/**'
      - 'Projects/Data/**'
  pull_request:
    branches: [ develop, main ]
    paths:
      - 'Projects/Domain/**'
      - 'Projects/Data/**'

jobs:
  tdd-tests:
    name: 🧪 TDD 테스트 실행
    runs-on: macos-15

    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4

    - name: 🔧 Xcode 설정
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: 📋 Xcode 버전 확인
      run: xcodebuild -version

    - name: 🔧 Tuist 직접 설치
      run: |
        curl -Ls https://install.tuist.io | bash
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: 🔧 프로젝트 생성
      run: |
        tuist install
        tuist generate

    - name: 🏗️ 프로젝트 빌드
      run: |
        xcodebuild clean build \
          -workspace DDDAttendance.xcworkspace \
          -scheme DDDAttendance \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -configuration Debug

    - name: 🧪 UseCase 테스트 실행
      run: |
        xcodebuild test \
          -workspace DDDAttendance.xcworkspace \
          -scheme DDDAttendance \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -only-testing:UseCaseTests \
          -resultBundlePath TestResults

    - name: 🧪 Repository 테스트 실행
      run: |
        xcodebuild test \
          -workspace DDDAttendance.xcworkspace \
          -scheme DDDAttendance \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -only-testing:RepositoryTests \
          -resultBundlePath TestResults
      continue-on-error: true  # Repository 테스트는 선택사항

    - name: 📊 테스트 결과 업로드
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults

  coverage-report:
    name: 📈 커버리지 리포트
    runs-on: macos-15
    needs: tdd-tests

    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4

    - name: 📊 코드 커버리지 생성
      run: |
        xcodebuild test \
          -workspace DDDAttendance.xcworkspace \
          -scheme DDDAttendance \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -enableCodeCoverage YES \
          -resultBundlePath CoverageResults

    - name: 📤 커버리지 업로드
      uses: codecov/codecov-action@v4
      with:
        files: CoverageResults/Coverage.xml
        fail_ci_if_error: false

  auto-deployment:
    name: 🚀 자동 배포
    runs-on: macos-15
    needs: [tdd-tests, coverage-report]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: 📥 체크아웃
      uses: actions/checkout@v4

    - name: 💎 Ruby 설정
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.2
        bundler-cache: true

    - name: 🚀 fastlane 배포
      run: |
        cd fastlane
        bundle exec fastlane QA
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
