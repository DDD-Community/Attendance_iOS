name: 🚀 Deploy Stage to TestFlight

# develop 브랜치에 머지/푸시되면 Stage(DDDAttendance-Stage) 빌드 후 TestFlight 업로드
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight-stage:
    name: Stage → TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # libswiftCompatibilitySpan.dylib(Swift 6.0.3+) 필요 → 16.2 이상
          xcode-version: '16.2'

      # 비밀정보(.env / Config / Matchfile / Fastfile)는 PUBLIC 레포에 두지 않고
      # 비공개 Config 레포(Roy-wonji/Attendance-iOS-Config)에서 받아와 주입
      - name: 비공개 Config 레포에서 CI 자산 받아오기
        env:
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${CONFIG_REPO_TOKEN}@github.com/Roy-wonji/Attendance-iOS-Config.git" /tmp/cfg
          mkdir -p Config fastlane
          cp /tmp/cfg/Config/*.xcconfig Config/
          cp /tmp/cfg/fastlane/.env       fastlane/.env
          cp /tmp/cfg/fastlane/Matchfile  fastlane/Matchfile
          cp /tmp/cfg/fastlane/Fastfile   fastlane/Fastfile
          # 받아온 비밀 자산이 절대 메인 레포에 커밋되지 않도록 git 추적/스테이징에서 제외
          git update-index --skip-worktree fastlane/Matchfile fastlane/Fastfile 2>/dev/null || true
          printf '%s\n' 'fastlane/.env' '*.env' 'Config/' >> .git/info/exclude
          echo "✅ CI 자산 주입 완료 (이 워크플로우는 commit/push를 수행하지 않음)"

      # 비밀 파일(.env 등)이 git 추적되면 빌드를 즉시 실패시켜 커밋을 원천 차단
      - name: 비밀파일 커밋 방지 검증
        run: |
          for f in fastlane/.env; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error::$f 가 git에 추적됨 — 커밋 위험! 빌드 중단"
              exit 1
            fi
          done
          echo "✅ .env 는 git 추적되지 않음 (커밋 불가) 확인"

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/tuist
            ~/.tuist
            Tuist/.build
          key: ${{ runner.os }}-tuist-${{ hashFiles('Tuist/Package.resolved') }}
          restore-keys: ${{ runner.os }}-tuist-

      # 프로젝트 검증 방식(TuistTool.swift)으로 의존성 설치 (test.yml과 동일)
      # 프로젝트 생성(generate)은 fastlane QA 레인이 ./make generate 로 수행
      # mise로 tuist만 명시 설치 (.tool-versions의 node/python 충돌은 install:false로 회피)
      - name: Setup mise
        uses: jdx/mise-action@v2
        with:
          install: false

      # 워크스페이스를 미리 생성하고 실제 생성 여부를 검증 (fastlane QA가 generate를 건너뛰게 함)
      - name: Tuist 설치 · 의존성 · 워크스페이스 생성
        run: |
          mise install tuist@4.180.0
          mise exec tuist@4.180.0 -- tuist install
          mise exec tuist@4.180.0 -- tuist generate --no-open
          ls -d *.xcworkspace || { echo "::error::워크스페이스 생성 실패"; exit 1; }

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fastlane QA — Stage 빌드 & TestFlight 업로드
        run: bundle exec fastlane QA

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage-ipa-${{ github.run_number }}
          path: fastlane/output/**
          retention-days: 14
          if-no-files-found: ignore
