name: PR Test Coverage

on:
  pull_request:
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행은 취소한다(러너가 한 대뿐이라 대기열을 줄인다).
concurrency:
  group: pr-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: self-hosted
    timeout-minutes: 90

    permissions:
      contents: read
      # PR 코멘트는 issues API 를 쓴다.
      issues: write
      pull-requests: write

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"

      - name: Restore gitignored build config
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$CONFIG_TAR" | base64 --decode | tar xzf -
          mkdir -p Projects/App/Resources
          printf '%s' "$GOOGLE_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist
          git check-ignore -q Config/base.xcconfig
          git check-ignore -q Projects/App/Resources/GoogleService-Info.plist

      - name: Install toolchain
        run: |
          mise install tuist
          bundle install

      - name: Generate Xcode workspace
        run: |
          tuist install
          tuist generate --no-open

      # self-hosted 러너는 실행 간 디스크가 유지되므로 이전 빌드 산출물을 비운다.
      - name: Prepare runner disk
        run: |
          DERIVED_DATA="$HOME/ci-derived-data/DDDAttendance"
          rm -rf "$DERIVED_DATA" TestResults.xcresult
          mkdir -p "$DERIVED_DATA"

      # 러너에 실제 존재하는 최신 iPhone 시뮬레이터를 고른다(이름 하드코딩은 Xcode 업데이트마다 깨진다).
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          # xcodebuild 원본 출력은 GitHub 로그 한도를 넘겨 잘린다.
          # tuist test 는 요약만 내보내고, 워크스페이스 전체가 아니라
          # 우리 타깃의 테스트만 돌려 외부 SPM 패키지 테스트를 끌고 오지 않는다.
          rm -rf TestResults TestResults.xcresult
          tuist test \
            --no-selective-testing \
            --result-bundle-path TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

      - name: Report to PR
        if: steps.tests.outcome != 'cancelled'
        uses: actions/github-script@v7
        env:
          RESULT_BUNDLE_DIR: TestResults
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            // github-script 의 require 는 액션 디렉토리 기준으로 경로를 풀어서
            // 상대경로가 먹지 않는다. 워크스페이스 절대경로로 지정한다.
            const report = require(`${process.env.GITHUB_WORKSPACE}/scripts/ios-test-report.js`)
            await report({ github, context, core })

      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
