name: PR Test

on:
  pull_request:
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행은 취소한다(러너가 한 대뿐이라 대기열을 줄인다).
concurrency:
  group: pr-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 90

    permissions:
      contents: read
      pull-requests: write

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"

      - name: Restore gitignored build config
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$CONFIG_TAR" | base64 --decode | tar xzf -
          mkdir -p Projects/App/Resources
          printf '%s' "$GOOGLE_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist
          git check-ignore -q Config/base.xcconfig
          git check-ignore -q Projects/App/Resources/GoogleService-Info.plist

      - name: Install toolchain
        run: |
          mise install tuist
          bundle install

      - name: Generate Xcode workspace
        run: |
          tuist install
          tuist generate --no-open

      # self-hosted 러너는 실행 간 디스크가 유지되므로 이전 빌드 산출물을 비운다.
      - name: Prepare runner disk
        run: |
          DERIVED_DATA="$HOME/ci-derived-data/DDDAttendance"
          rm -rf "$DERIVED_DATA" TestResults.xcresult
          mkdir -p "$DERIVED_DATA"

      # 러너에 실제 존재하는 최신 iPhone 시뮬레이터를 고른다(이름 하드코딩은 Xcode 업데이트마다 깨진다).
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys, re
          d = json.load(sys.stdin)['devices']
          best = None
          for rt, devs in d.items():
              m = re.search(r'iOS-(\d+)-(\d+)', rt)
              if not m:
                  continue
              ver = (int(m.group(1)), int(m.group(2)))
              for dev in devs:
                  if not dev.get('isAvailable'):
                      continue
                  if not dev['name'].startswith('iPhone'):
                      continue
                  key = (ver, dev['name'])
                  if best is None or key > best[0]:
                      best = (key, dev)
          print(best[1]['udid'] if best else '')
          ")
          test -n "$UDID" || { echo "사용 가능한 iPhone 시뮬레이터가 없습니다"; exit 1; }
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          # DerivedData 는 러너 홈의 CI 전용 경로만 사용한다.
          DERIVED_DATA="$HOME/ci-derived-data/DDDAttendance"
          xcodebuild test \
            -workspace DDDAttendance.xcworkspace \
            -scheme DDDAttendance-Workspace \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
