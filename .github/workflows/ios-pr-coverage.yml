name: PR Test Coverage

on:
  pull_request:
    branches: [develop, main]

# 같은 PR 에 새 커밋이 오면 이전 실행은 취소한다(러너가 한 대뿐이라 대기열을 줄인다).
concurrency:
  group: pr-coverage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: self-hosted
    timeout-minutes: 90

    permissions:
      contents: read
      # PR 코멘트는 issues API 를 쓴다.
      issues: write
      pull-requests: write

    env:
      TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
      TUIST_BUILD_TAGS: ci,pull-request
      TUIST_BUILD_VALUE_PR_URL: ${{ github.server_url }}/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      TEST_RUN_REPORT_PATH: TestRunReport.json
      BUILD_RUN_REPORT_PATH: BuildRunReport.json
      BUNDLE_INSPECT_REPORT_PATH: BundleInspectReport.json

    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          echo "$HOME/.rbenv/shims" >> "$GITHUB_PATH"
          echo "CI_DERIVED_DATA=$HOME/ci-derived-data/DDDAttendance-pr" >> "$GITHUB_ENV"

      - name: Restore gitignored build config
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$CONFIG_TAR" | base64 --decode | tar xzf -
          mkdir -p Projects/App/Resources
          printf '%s' "$GOOGLE_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist
          git check-ignore -q Config/base.xcconfig
          git check-ignore -q Projects/App/Resources/GoogleService-Info.plist

      - name: Install toolchain
        run: |
          mise install tuist
          bundle install

      # CI 잡마다 캐시 데몬과 소켓을 빌드 전에 보장한다.
      # 인증이나 daemon 기동이 실패해도 테스트 자체는 캐시 없이 계속한다.
      - name: Setup Tuist cache
        id: tuist-cache
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup cache

      - name: Configure compilation cache fallback
        run: |
          if [[ "${{ steps.tuist-cache.outcome }}" == "success" ]]; then
            echo "XCODE_COMPILATION_CACHE_ENABLED=YES" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "XCODE_COMPILATION_CACHE_ENABLED=NO" >> "$GITHUB_ENV"
          echo "Tuist cache를 사용할 수 없어 이번 실행은 Xcode compilation cache 없이 진행합니다."
          CACHE_LOG="$HOME/.local/state/tuist/tuist.cache.DDD2026_attendance.stderr.log"
          if [[ -f "$CACHE_LOG" ]]; then
            tail -n 80 "$CACHE_LOG"
          fi

      # 토큰 권한이 정상일 때만 러너 메트릭 수집을 활성화한다.
      - name: Setup Tuist insights
        continue-on-error: true
        timeout-minutes: 3
        run: mise exec -- tuist setup insights

      - name: Generate Xcode workspace
        run: |
          mise exec -- tuist install
          mise exec -- tuist generate --no-open

      # CompilationCache.noindex는 유지하고 이전 실행의 빌드 산출물만 비운다.
      # DerivedData 전체를 지우면 Xcode compilation cache도 함께 사라진다.
      - name: Prepare runner disk
        run: |
          mkdir -p "$CI_DERIVED_DATA"
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist"
          rm -rf \
            TestResults \
            TestResults.xcresult \
            BundleBuildResults.xcresult \
            "$TEST_RUN_REPORT_PATH" \
            "$BUILD_RUN_REPORT_PATH" \
            "$BUNDLE_INSPECT_REPORT_PATH" \
            DDDAttendance-Stage.ipa

      # Xcode 업데이트 뒤에도 러너에 실제 설치된 최신 iPhone runtime을 사용한다.
      - name: Select simulator
        run: |
          SIMULATOR_DESTINATION="$(python3 Scripts/select-ios-simulator.py)"
          echo "SIMULATOR_DESTINATION=$SIMULATOR_DESTINATION" >> "$GITHUB_ENV"

      # 사용 중인 개발용 기기 대신 유휴 기기를 부팅하고 actool의 CoreSimulator spawn을 미리 검증한다.
      - name: Prepare simulator
        run: ./Scripts/prepare-ios-simulator.sh

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          # 모듈 테스트는 별도 host 없이 Stage workspace scheme에서 한 번만 실행한다.
          # Point-Free Sharing은 정적으로 링크해 Apple Sharing.framework와의 충돌을 피한다.
          ./Scripts/run-isolated-module-tests.sh

      # tuist test 실패 시 Test Insights만 업로드될 수 있으므로, 남은 xcactivitylog를
      # 명시적으로 분석해 Builds 표에도 실패한 Stage 빌드를 기록한다.
      - name: Report failed build to Tuist
        if: steps.tests.outcome == 'failure'
        continue-on-error: true
        run: |
          mise exec -- tuist inspect build \
            --derived-data-path "$CI_DERIVED_DATA"

      # 테스트 빌드의 DerivedData를 재사용해 추가 컴파일을 줄이고 PR 크기 변화를 기록한다.
      - name: Build app for bundle insights
        id: app-build
        if: steps.tests.outcome == 'success'
        run: |
          TUIST_RUN_REPORT_PATH="$BUILD_RUN_REPORT_PATH" \
            mise exec -- tuist xcodebuild build \
            -workspace DDDAttendance.xcworkspace \
            -scheme DDDAttendance-Stage \
            -configuration Stage \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CI_DERIVED_DATA" \
            -resultBundlePath BundleBuildResults.xcresult \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILATION_CACHE_ENABLE_CACHING="$XCODE_COMPILATION_CACHE_ENABLED"

          if [[ ! -s "$BUILD_RUN_REPORT_PATH" ]]; then
            echo "Tuist build run이 서버 dashboard URL을 기록하지 못했습니다: $BUILD_RUN_REPORT_PATH" >&2
            exit 1
          fi

      - name: Inspect bundle size
        if: steps.tests.outcome == 'success' && steps.app-build.outcome == 'success'
        continue-on-error: true
        run: |
          # 번들 크기는 디바이스 아키텍처 기준이어야 의미가 있다.
          # 시뮬레이터 산출물로 만든 ipa 는 download size 가 Unknown 으로 남는다.
          APP_PATH="$(find "$CI_DERIVED_DATA/Build/Products/Stage-iphoneos" -maxdepth 1 -type d -name DDDAttendance.app -print -quit)"
          if [[ -z "$APP_PATH" ]]; then
            echo "Stage 디바이스 앱 번들을 찾지 못했습니다." >&2
            exit 1
          fi

          BUNDLE_PAYLOAD="$RUNNER_TEMP/attendance-bundle-payload"
          rm -rf "$BUNDLE_PAYLOAD"
          mkdir -p "$BUNDLE_PAYLOAD/Payload"
          ditto "$APP_PATH" "$BUNDLE_PAYLOAD/Payload/DDDAttendance.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$BUNDLE_PAYLOAD/Payload" \
            DDDAttendance-Stage.ipa

          # IPA를 검사해야 압축 후 Download size까지 PR 리포트에 기록된다.
          mise exec -- tuist inspect bundle DDDAttendance-Stage.ipa --json \
            > "$BUNDLE_INSPECT_REPORT_PATH"

          # --json은 로컬 출력만 만들고 서버에 업로드하지 않으므로,
          # Tuist Run Report의 Bundles 섹션을 위해 한 번 더 등록한다.
          mise exec -- tuist inspect bundle DDDAttendance-Stage.ipa

      - name: Upload test and run reports
        id: upload-test-reports
        if: always()
        continue-on-error: true
        # v7은 Node 24를 사용하며 self-hosted runner 2.327.1 이상이 필요하다.
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ github.run_id }}
          path: |
            TestResults.xcresult
            BundleBuildResults.xcresult
            TestRunReport.json
            BuildRunReport.json
            BundleInspectReport.json
            DDDAttendance-Stage.ipa
            TuistTestRun.log
            TestLogs
          if-no-files-found: ignore
          retention-days: 7

      # self-hosted runner에서 artifact finalize가 간헐적으로 403을 반환할 수 있다.
      # immutable artifact 충돌을 피하도록 새 이름으로 한 번 더 업로드한다.
      - name: Retry test and run report upload
        if: always() && steps.upload-test-reports.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ github.run_id }}-retry-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            BundleBuildResults.xcresult
            TestRunReport.json
            BuildRunReport.json
            BundleInspectReport.json
            DDDAttendance-Stage.ipa
            TuistTestRun.log
            TestLogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Report to PR
        if: always() && steps.tests.outcome != 'cancelled'
        uses: actions/github-script@v7
        env:
          RESULT_BUNDLE_DIR: TestResults.xcresult
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        with:
          script: |
            // github-script 의 require 는 액션 디렉토리 기준으로 경로를 풀어서
            // 상대경로가 먹지 않는다. 워크스페이스 절대경로로 지정한다.
            const report = require(`${process.env.GITHUB_WORKSPACE}/Scripts/ios-test-report.js`)
            await report({ github, context, core })

      - name: Clean CI DerivedData
        if: always()
        run: |
          rm -rf \
            "$CI_DERIVED_DATA/Build" \
            "$CI_DERIVED_DATA/Index.noindex" \
            "$CI_DERIVED_DATA/Logs" \
            "$CI_DERIVED_DATA/SourcePackages" \
            "$CI_DERIVED_DATA/info.plist"
          rm -rf \
            BundleBuildResults.xcresult \
            "$TEST_RUN_REPORT_PATH" \
            "$BUILD_RUN_REPORT_PATH" \
            "$BUNDLE_INSPECT_REPORT_PATH" \
            DDDAttendance-Stage.ipa

      - name: Fail if tests failed
        if: steps.tests.outcome != 'success'
        run: exit 1
