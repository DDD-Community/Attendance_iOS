name: TestFlight Auto Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true
  FASTLANE_DISABLE_COLORS: true
  FASTLANE_HIDE_GITHUB_ISSUES: true
  SKIP_UPDATE_CHECK: true

jobs:
  testflight-deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false

    - name: Install Ruby dependencies
      run: |
        gem install bundler --no-document
        bundle config set --local deployment false
        # Update fastlane to latest version to avoid auto-update conflicts
        bundle update fastlane
        bundle install --jobs 4 --retry 3

    - name: Cache Tuist
      uses: actions/cache@v4
      with:
        path: ~/.tuist
        key: ${{ runner.os }}-tuist-${{ hashFiles('**/Tuist.swift', '**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install Tuist via mise
      run: |
        mise install tuist
        echo "$(tuist version)"

    - name: Generate Tuist project
      env:
        TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        CI: true
        TUIST_STATS_OPT_OUT: 1
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        REVERSED_CLIENT_ID: ${{ secrets.REVERSED_CLIENT_ID }}
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Config files:"
        ls -la Config/ || echo "Config directory not found"

        # Create Config files for CI based on actual structure
        mkdir -p Config

        # Create Shared.xcconfig
        echo "// Shared.xcconfig - Auto-generated for CI" > Config/Shared.xcconfig
        echo "MARKETING_VERSION=1.0.0" >> Config/Shared.xcconfig
        echo "CURRENT_PROJECT_VERSION=20" >> Config/Shared.xcconfig

        # Create Dev.xcconfig
        echo "// Dev.xcconfig - Auto-generated for CI" > Config/Dev.xcconfig
        echo "#include \"./Shared.xcconfig\"" >> Config/Dev.xcconfig
        echo "" >> Config/Dev.xcconfig
        echo "OTHER_SWIFT_FLAGS[config=STAGE][sdk=*] = \$(inherited) -DDEBUG" >> Config/Dev.xcconfig
        echo "SWIFT_ACTIVE_COMPILATION_CONDITIONS = STAGE" >> Config/Dev.xcconfig
        echo "BUNDLE_DISPLAY_NAME = DDD" >> Config/Dev.xcconfig
        echo "BASE_URL= api.dddstudy.site/" >> Config/Dev.xcconfig
        echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig
        echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig
        echo "REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig

        # Create Stage.xcconfig
        cp Config/Dev.xcconfig Config/Stage.xcconfig

        # Create Release.xcconfig
        echo "// Release.xcconfig - Auto-generated for CI" > Config/Release.xcconfig
        echo "#include \"./Shared.xcconfig\"" >> Config/Release.xcconfig
        echo "" >> Config/Release.xcconfig
        echo "OTHER_SWIFT_FLAGS[config=PROD][sdk=*] = \$(inherited) -PROD" >> Config/Release.xcconfig
        echo "SWIFT_ACTIVE_COMPILATION_CONDITIONS = PROD" >> Config/Release.xcconfig
        echo "BUNDLE_DISPLAY_NAME = DDD" >> Config/Release.xcconfig
        echo "BASE_URL= api.dddstudy.site/" >> Config/Release.xcconfig
        echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig
        echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig
        echo "REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig

        # Create Prod.xcconfig (same as Release)
        cp Config/Release.xcconfig Config/Prod.xcconfig

        echo "Config files created:"
        ls -la Config/

        # Ensure we're in the right directory
        if [ ! -f "Tuist.swift" ]; then
          echo "Tuist.swift not found, listing all Tuist.swift files:"
          find . -name "Tuist.swift" -type f 2>/dev/null || echo "No Tuist.swift found"
          exit 1
        fi

        # Generate with release configuration for CI builds
        tuist install && tuist generate --configuration Release

    - name: Set up SSH key for match repository
      env:
        MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
      run: |
        # Set up SSH key for match repository access
        mkdir -p ~/.ssh
        echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
        chmod 600 ~/.ssh/match_deploy_key

        # Add GitHub to known hosts
        ssh-keyscan github.com >> ~/.ssh/known_hosts

        # Configure SSH to use the key
        cat > ~/.ssh/config << EOF
        Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/match_deploy_key
          IdentitiesOnly yes
        EOF

    - name: Set up fastlane environment
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Set up App Store Connect API key
        mkdir -p private_keys
        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

    - name: Verify bundle setup
      run: |
        echo "Bundle version: $(bundle version)"
        echo "Checking Gemfile.lock..."
        bundle check || echo "Bundle check failed, but continuing..."

    - name: Debug build setup
      run: |
        echo "Current directory contents:"
        ls -la
        echo "Available schemes:"
        xcodebuild -workspace DDDAttendance.xcworkspace -list
        echo "Available configurations:"
        xcodebuild -workspace DDDAttendance.xcworkspace -scheme DDDAttendance-Stage -showBuildSettings | grep -E "^[[:space:]]*CONFIGURATION"

    - name: Test simple xcodebuild
      env:
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        echo "Testing simple xcodebuild command..."
        xcodebuild -workspace DDDAttendance.xcworkspace \
                   -scheme DDDAttendance-Stage \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   -showBuildSettings | head -20

        echo "Testing code signing settings..."
        xcodebuild -workspace DDDAttendance.xcworkspace \
                   -scheme DDDAttendance-Stage \
                   -configuration Release \
                   -showBuildSettings | grep -i "CODE_SIGN\|TEAM\|PROVISIONING" || echo "No code sign settings found"

    - name: Run Fastlane QA with extensive debugging
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
        FASTLANE_SKIP_UPDATE_CHECK: true
        FASTLANE_DISABLE_COLORS: false
        FASTLANE_HIDE_GITHUB_ISSUES: false
      run: |
        set -e  # Exit on any error
        echo "Starting fastlane QA..."

        # Run with maximum verbosity and capture output
        bundle exec fastlane QA --verbose 2>&1 | tee fastlane_output.log || {
          echo "=== FASTLANE FAILED ==="
          echo "Exit code: $?"

          # Show the gym log if it exists
          if [ -f "$HOME/Library/Logs/gym/DDDAttendance_Stage-DDDAttendance-Stage.log" ]; then
            echo "=== GYM BUILD LOG ==="
            tail -50 "$HOME/Library/Logs/gym/DDDAttendance_Stage-DDDAttendance-Stage.log"
          fi

          # Show fastlane output
          if [ -f "fastlane_output.log" ]; then
            echo "=== FASTLANE OUTPUT (last 50 lines) ==="
            tail -50 fastlane_output.log
          fi

          # Show any other relevant logs
          echo "=== AVAILABLE LOG FILES ==="
          find "$HOME/Library/Logs" -name "*gym*" -o -name "*fastlane*" 2>/dev/null || echo "No additional logs found"

          exit 1
        }

    - name: Create QA commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BUILD_NUMBER=$(grep -o 'CURRENT_PROJECT_VERSION = [0-9]*' Config/Shared.xcconfig | grep -o '[0-9]*')
        MARKETING_VERSION=$(grep -o 'MARKETING_VERSION = [0-9.]*' Config/Shared.xcconfig | grep -o '[0-9.]*')

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # QA 커밋 메시지 생성
        QA_MESSAGE="🚀 QA: TestFlight 배포 완료 v${MARKETING_VERSION}(${BUILD_NUMBER})"

        # 빈 커밋으로 QA 기록 남기기
        git commit --allow-empty -m "$QA_MESSAGE"
        git push origin develop

