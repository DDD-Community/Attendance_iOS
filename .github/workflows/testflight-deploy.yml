name: TestFlight Auto Deploy

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true

jobs:
  testflight-deploy:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'develop')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Cache Tuist
      uses: actions/cache@v4
      with:
        path: ~/.tuist
        key: ${{ runner.os }}-tuist-${{ hashFiles('**/Tuist.swift', '**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install Tuist via mise
      run: |
        mise install tuist
        echo "$(tuist version)"

    - name: Generate Tuist project
      env:
        TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        CI: true
        TUIST_STATS_OPT_OUT: 1
        BASE_URL: ${{ secrets.BASE_URL }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        REVERSED_CLIENT_ID: ${{ secrets.REVERSED_CLIENT_ID }}
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Config files:"
        ls -la Config/ || echo "Config directory not found"

        # Create Config files for CI based on actual structure
        mkdir -p Config

        # Create Shared.xcconfig
        cat > Config/Shared.xcconfig << 'EOF'
//
//  Shared.xcconfig - Auto-generated for CI
//
MARKETING_VERSION=1.0.0
CURRENT_PROJECT_VERSION=20
EOF

        # Create Dev.xcconfig with environment variables
        cat > Config/Dev.xcconfig << EOF
//
//  Dev.xcconfig - Auto-generated for CI
//
#include "./Shared.xcconfig"

OTHER_SWIFT_FLAGS[config=STAGE][sdk=*] = \$(inherited) -DDEBUG
SWIFT_ACTIVE_COMPILATION_CONDITIONS = STAGE
BUNDLE_DISPLAY_NAME = DDD
BASE_URL= ${BASE_URL:-api.dddstudy.site/}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}
REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}
EOF

        # Create Stage.xcconfig
        cat > Config/Stage.xcconfig << EOF
//
//  Stage.xcconfig - Auto-generated for CI
//
#include "./Shared.xcconfig"

OTHER_SWIFT_FLAGS[config=STAGE][sdk=*] = \$(inherited) -DDEBUG
SWIFT_ACTIVE_COMPILATION_CONDITIONS = STAGE
BUNDLE_DISPLAY_NAME = DDD
BASE_URL= ${BASE_URL:-api.dddstudy.site/}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}
REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}
EOF

        # Create Release.xcconfig
        cat > Config/Release.xcconfig << EOF
//
//  Release.xcconfig - Auto-generated for CI
//
#include "./Shared.xcconfig"

OTHER_SWIFT_FLAGS[config=PROD][sdk=*] = \$(inherited) -PROD
SWIFT_ACTIVE_COMPILATION_CONDITIONS = PROD
BUNDLE_DISPLAY_NAME = DDD
BASE_URL= ${BASE_URL:-api.dddstudy.site/}
GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}
REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}
EOF

        # Create Prod.xcconfig (copy of Release but with PROD settings)
        cp Config/Release.xcconfig Config/Prod.xcconfig

        echo "Config files created:"
        ls -la Config/

        # Ensure we're in the right directory
        if [ ! -f "Tuist.swift" ]; then
          echo "Tuist.swift not found, listing all Tuist.swift files:"
          find . -name "Tuist.swift" -type f 2>/dev/null || echo "No Tuist.swift found"
          exit 1
        fi

        # Generate with debug configuration
        tuist install && tuist generate --configuration Debug

    - name: Install CocoaPods
      run: |
        cd DDDAttendance
        pod install --repo-update

    - name: Set up fastlane environment
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
      run: |
        mkdir -p private_keys
        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

    - name: Run Fastlane QA
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        bundle exec fastlane QA

    - name: Create QA commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BUILD_NUMBER=$(grep -o 'CURRENT_PROJECT_VERSION = [0-9]*' Config/Shared.xcconfig | grep -o '[0-9]*')
        MARKETING_VERSION=$(grep -o 'MARKETING_VERSION = [0-9.]*' Config/Shared.xcconfig | grep -o '[0-9.]*')

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # QA 커밋 메시지 생성
        QA_MESSAGE="🚀 QA: TestFlight 배포 완료 v${MARKETING_VERSION}(${BUILD_NUMBER})"

        # 빈 커밋으로 QA 기록 남기기
        git commit --allow-empty -m "$QA_MESSAGE"
        git push origin develop

