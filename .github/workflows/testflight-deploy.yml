name: TestFlight Auto Deploy

on:
  push:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true
  FASTLANE_DISABLE_COLORS: true
  FASTLANE_HIDE_GITHUB_ISSUES: true
  SKIP_UPDATE_CHECK: true

jobs:
  testflight-deploy:
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: false

    - name: Install Ruby dependencies
      run: |
        gem install bundler --no-document
        bundle config set --local deployment false
        # Update fastlane to latest version to avoid auto-update conflicts
        bundle update fastlane
        bundle install --jobs 4 --retry 3

    - name: Cache Tuist
      uses: actions/cache@v4
      with:
        path: ~/.tuist
        key: ${{ runner.os }}-tuist-${{ hashFiles('**/Tuist.swift', '**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install Tuist via mise
      run: |
        mise install tuist
        echo "$(tuist version)"

    - name: Verify repository setup
      run: |
        echo "Current directory: $(pwd)"
        echo "Checking Tuist.swift: $(ls Tuist.swift 2>/dev/null && echo "✅ Found" || echo "❌ Missing")"


    - name: Generate Tuist project
      env:
        TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        CI: true
        TUIST_STATS_OPT_OUT: 1
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        REVERSED_CLIENT_ID: ${{ secrets.REVERSED_CLIENT_ID }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        set -e  # Exit immediately if any command fails
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Config files:"
        ls -la Config/ || echo "Config directory not found"

        # Create Config files for CI based on actual structure
        mkdir -p Config

        # Create Shared.xcconfig
        echo "// Shared.xcconfig - Auto-generated for CI" > Config/Shared.xcconfig
        echo "MARKETING_VERSION=1.0.0" >> Config/Shared.xcconfig
        echo "CURRENT_PROJECT_VERSION=20" >> Config/Shared.xcconfig

        # Create Dev.xcconfig
        echo "// Dev.xcconfig - Auto-generated for CI" > Config/Dev.xcconfig
        echo "#include \"./Shared.xcconfig\"" >> Config/Dev.xcconfig
        echo "" >> Config/Dev.xcconfig
        echo "OTHER_SWIFT_FLAGS[config=STAGE][sdk=*] = \$(inherited) -DDEBUG" >> Config/Dev.xcconfig
        echo "SWIFT_ACTIVE_COMPILATION_CONDITIONS = STAGE" >> Config/Dev.xcconfig
        echo "BUNDLE_DISPLAY_NAME = DDD" >> Config/Dev.xcconfig
        echo "BASE_URL= api.dddstudy.site/" >> Config/Dev.xcconfig
        echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig
        echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig
        echo "REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}" >> Config/Dev.xcconfig

        # Create Stage.xcconfig
        cp Config/Dev.xcconfig Config/Stage.xcconfig

        # Create Release.xcconfig
        echo "// Release.xcconfig - Auto-generated for CI" > Config/Release.xcconfig
        echo "#include \"./Shared.xcconfig\"" >> Config/Release.xcconfig
        echo "" >> Config/Release.xcconfig
        echo "OTHER_SWIFT_FLAGS[config=PROD][sdk=*] = \$(inherited) -PROD" >> Config/Release.xcconfig
        echo "SWIFT_ACTIVE_COMPILATION_CONDITIONS = PROD" >> Config/Release.xcconfig
        echo "BUNDLE_DISPLAY_NAME = DDD" >> Config/Release.xcconfig
        echo "BASE_URL= api.dddstudy.site/" >> Config/Release.xcconfig
        echo "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig
        echo "GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig
        echo "REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}" >> Config/Release.xcconfig

        # Create Prod.xcconfig (same as Release)
        cp Config/Release.xcconfig Config/Prod.xcconfig

        echo "Config files created:"
        ls -la Config/

        echo "=== Compiling TuistTool ==="
        swiftc TuistTool.swift -o make

        echo "=== Installing dependencies ==="
        ./make install || echo "tuist install failed, continuing..."

        echo "=== Generating workspace ==="
        ./make generate

        echo "✅ Config and workspace ready"

    - name: Set up SSH key for match repository
      env:
        MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
      run: |
        # Set up SSH key for match repository access
        mkdir -p ~/.ssh
        echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
        chmod 600 ~/.ssh/match_deploy_key

        # Add GitHub to known hosts
        ssh-keyscan github.com >> ~/.ssh/known_hosts

        # Configure SSH to use the key
        cat > ~/.ssh/config << EOF
        Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/match_deploy_key
          IdentitiesOnly yes
        EOF

    - name: Set up fastlane environment
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Set up App Store Connect API key
        mkdir -p private_keys
        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8


    - name: Run Fastlane QA with extensive debugging
      working-directory: .
      env:
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
        FASTLANE_SKIP_UPDATE_CHECK: true
        FASTLANE_DISABLE_COLORS: false
        FASTLANE_HIDE_GITHUB_ISSUES: false
      run: |
        echo "Starting fastlane QA..."
        echo "Current working directory: $(pwd)"
        echo "Gemfile location: $(find . -name Gemfile)"
        echo "Fastfile location: $(find . -name Fastfile)"
        echo "Directory contents:"
        ls -la

        # Ensure we're in project root and run fastlane
        echo "Before CD - Current directory: $(pwd)"
        echo "Repository structure debug:"
        echo "Looking for Tuist.swift: $(find . -name "Tuist.swift" | head -5)"
        echo "Looking for .xcworkspace: $(find . -name "*.xcworkspace" | head -5)"
        echo "Looking for Fastfile: $(find . -name "Fastfile" | head -5)"

        # Find the actual project root (where Tuist.swift and .xcworkspace files are)
        echo "=== FINDING PROJECT ROOT ==="
        TUIST_FILE=$(find . -name "Tuist.swift" -type f | head -1)
        echo "Found Tuist.swift at: $TUIST_FILE"

        if [ -n "$TUIST_FILE" ]; then
          PROJECT_ROOT=$(dirname "$TUIST_FILE")
          echo "Calculated project root: $PROJECT_ROOT"

          # Convert to absolute path and navigate there
          ABSOLUTE_PROJECT_ROOT=$(cd "$PROJECT_ROOT" && pwd)
          echo "Absolute project root: $ABSOLUTE_PROJECT_ROOT"

          cd "$ABSOLUTE_PROJECT_ROOT"
          echo "Successfully changed to: $(pwd)"
        else
          echo "Could not find Tuist.swift, staying in current directory: $(pwd)"
        fi

        echo "=== PROJECT STRUCTURE VERIFICATION ==="
        echo "Current working directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Files in fastlane directory:"
        ls -la fastlane/ 2>/dev/null || echo "No fastlane directory found"
        echo "Workspace files in current directory:"
        ls -la *.xcworkspace 2>/dev/null || echo "No workspace files found"

        echo "=== STARTING FASTLANE ==="
        FASTLANE_WORKING_DIR=$(pwd)
        export FASTLANE_WORKING_DIR
        echo "Fastlane working directory: $FASTLANE_WORKING_DIR"

        bundle exec fastlane QA --verbose 2>&1 | tee fastlane_output.log
        FASTLANE_EXIT_CODE=${PIPESTATUS[0]}

        echo ""
        echo "=== FASTLANE EXIT CODE: $FASTLANE_EXIT_CODE ==="
        echo ""

        if [ $FASTLANE_EXIT_CODE -ne 0 ]; then
          echo "=== FASTLANE FAILED - DETAILED LOGS ==="

          # Show fastlane output first
          echo "=== FASTLANE OUTPUT (last 200 lines) ==="
          tail -200 fastlane_output.log
          echo ""

          # Find and show ALL gym logs with error focus
          echo "=== SEARCHING FOR GYM LOGS ==="
          if [ -d "$HOME/Library/Logs/gym" ]; then
            find "$HOME/Library/Logs/gym" -name "*.log" 2>/dev/null | while read -r log_file; do
              echo "=== Found gym log: $log_file ==="

              # First look for errors in the log
              echo "=== SEARCHING FOR ERRORS IN GYM LOG ==="
              if grep -i -n -A5 -B5 "error\|failed\|exception\|abort" "$log_file" 2>/dev/null; then
                echo "Found error messages above"
              else
                echo "No obvious error keywords found, showing end of log:"
                echo "=== Last 100 lines of $log_file ==="
                tail -100 "$log_file" 2>/dev/null || echo "Could not read log file"
              fi
              echo ""
            done
          else
            echo "No gym logs directory found at $HOME/Library/Logs/gym"
          fi

          # Find any xcodebuild logs in Logs directory
          echo "=== SEARCHING FOR XCODEBUILD LOGS ==="
          find "$HOME/Library/Logs" -name "*xcodebuild*" -o -name "*build*" 2>/dev/null | while read -r log_file; do
            echo "=== Found build log: $log_file ==="
            tail -100 "$log_file" 2>/dev/null || echo "Could not read log file"
            echo ""
          done

          # Show DerivedData logs if available
          echo "=== CHECKING DERIVED DATA LOGS ==="
          if [ -d "$HOME/Library/Developer/Xcode/DerivedData" ]; then
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.log" 2>/dev/null | head -5 | while read -r log_file; do
              echo "=== Found DerivedData log: $log_file ==="
              tail -100 "$log_file" 2>/dev/null || echo "Could not read log file"
              echo ""
            done
          else
            echo "No DerivedData directory found"
          fi

          # List all available logs for debugging
          echo "=== ALL LOG FILES IN ~/Library/Logs ==="
          find "$HOME/Library/Logs" -name "*.log" 2>/dev/null | head -30

          exit $FASTLANE_EXIT_CODE
        else
          echo "=== FASTLANE SUCCEEDED ==="
        fi

    - name: Create QA commit
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BUILD_NUMBER=$(grep -o 'CURRENT_PROJECT_VERSION=20' Config/Shared.xcconfig | grep -o '[0-9]*')
        MARKETING_VERSION=$(grep -o 'MARKETING_VERSION=1.0.0' Config/Shared.xcconfig | grep -o '[0-9.]*')

        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # QA 커밋 메시지 생성
        QA_MESSAGE="🚀 QA: TestFlight 배포 완료 v${MARKETING_VERSION}(${BUILD_NUMBER})"

        # 빈 커밋으로 QA 기록 남기기
        git commit --allow-empty -m "$QA_MESSAGE"
        git push origin develop

