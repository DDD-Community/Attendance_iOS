name: TestFlight Auto Deploy

on:
  push:
  pull_request:
    branches: [develop]
    types: [closed]

permissions:
  contents: read

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true
  FASTLANE_DISABLE_COLORS: true
  FASTLANE_HIDE_GITHUB_ISSUES: true
  SKIP_UPDATE_CHECK: true

jobs:
  testflight-deploy:
    if: github.event_name == 'push'
    runs-on: macos-15-xlarge
    timeout-minutes: 40

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install fastlane
      run: brew install fastlane

    - name: Cache Build Dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.tuist
          Tuist/.build
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Caches/com.apple.dt.Xcode
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-xcode-${{ hashFiles('**/Tuist.swift', '**/Package.swift', '**/Podfile.lock') }}-${{ github.run_number }}
        restore-keys: |
          ${{ runner.os }}-xcode-${{ hashFiles('**/Tuist.swift', '**/Package.swift', '**/Podfile.lock') }}
          ${{ runner.os }}-xcode-

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install Tuist via mise
      run: |
        mise install tuist
        echo "$(tuist version)"




    - name: Generate Tuist project
      env:
        TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        CI: true
        TUIST_STATS_OPT_OUT: 1
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        REVERSED_CLIENT_ID: ${{ secrets.REVERSED_CLIENT_ID }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        set -e  # Exit immediately if any command fails
        # Quick config with auto-incrementing build number
        BUILD_NUMBER=${{ github.run_number }}
        mkdir -p Config
        cat > Config/Shared.xcconfig << EOF
        MARKETING_VERSION=1.0.0
        CURRENT_PROJECT_VERSION=$BUILD_NUMBER
        EOF

        # Create all required config files
        cat > Config/Dev.xcconfig << EOF
        #include "./Shared.xcconfig"
        BUNDLE_DISPLAY_NAME = DDD
        GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
        EOF

        cp Config/Dev.xcconfig Config/Stage.xcconfig
        cp Config/Dev.xcconfig Config/Release.xcconfig
        cp Config/Dev.xcconfig Config/Prod.xcconfig

        # Build with detailed logging
        echo "=== Compiling TuistTool ==="
        swiftc TuistTool.swift -o make

        echo "=== Checking environment ==="
        echo "Current directory: $(pwd)"
        echo "PATH: $PATH"
        echo "Which tuist: $(which tuist)"
        echo "Tuist version: $(tuist version 2>&1 || echo 'tuist not found')"
        echo "Swift version: $(swift --version | head -1)"

        echo "=== Installing dependencies ==="
        if ./make install; then
          echo "✅ make install succeeded"
        else
          echo "❌ make install failed, trying tuist directly"
          tuist install
        fi

        echo "=== Generating workspace ==="
        if ./make generate; then
          echo "✅ make generate succeeded"
        else
          echo "❌ make generate failed, trying tuist directly"
          tuist generate --no-open
        fi

        # Force check workspace creation
        echo "=== Final workspace check ==="
        if ls *.xcworkspace 1>/dev/null 2>&1; then
          echo "✅ Workspace found:"
          ls -la *.xcworkspace
        else
          echo "❌ No workspace found!"
          echo "Available files:"
          ls -la
          exit 1
        fi

    - name: Deploy to TestFlight
      env:
        MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_APPLE_ID: ${{ secrets.APPLE_ID }}
        APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
        APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        # Setup SSH and API keys
        mkdir -p ~/.ssh private_keys
        echo "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
        chmod 600 ~/.ssh/match_deploy_key
        ssh-keyscan github.com >> ~/.ssh/known_hosts

        # Configure SSH to use the key
        cat > ~/.ssh/config << EOF
        Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/match_deploy_key
          IdentitiesOnly yes
        EOF

        echo "$APP_STORE_CONNECT_API_KEY_CONTENT" | base64 --decode > private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}.p8

        # Deploy
        fastlane QA


