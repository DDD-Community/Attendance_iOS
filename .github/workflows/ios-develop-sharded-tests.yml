name: Develop Sharded Tests

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: develop-sharded-tests
  cancel-in-progress: true

env:
  TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  build-shards:
    name: Build test shards
    runs-on: self-hosted
    timeout-minutes: 90

    permissions:
      contents: read

    env:
      CI_DERIVED_DATA: ${{ runner.temp }}/DDDAttendance-shard-build-${{ github.run_id }}

    outputs:
      matrix: ${{ steps.build.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Restore gitignored build config
        env:
          CONFIG_TAR: ${{ secrets.CONFIG_DIR_TAR_BASE64 }}
          GOOGLE_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          printf '%s' "$CONFIG_TAR" | base64 --decode | tar xzf -
          mkdir -p Projects/App/Resources
          printf '%s' "$GOOGLE_PLIST" | base64 --decode > Projects/App/Resources/GoogleService-Info.plist
          git check-ignore -q Config/base.xcconfig
          git check-ignore -q Projects/App/Resources/GoogleService-Info.plist

      - name: Install Tuist
        run: mise install tuist

      - name: Setup Tuist cache
        run: mise exec -- tuist setup cache

      # Build Insights가 빌드 중 CPU/메모리 같은 러너 메트릭도 함께 수집하게 한다.
      - name: Setup Tuist insights
        run: mise exec -- tuist setup insights

      - name: Install project dependencies
        run: mise exec -- tuist install

      # develop 변경의 영향을 받는 테스트만 빌드한다. Tuist가 저장한 의존 그래프를
      # 사용하므로 전체 테스트 빌드를 강제하는 --no-selective-testing은 넣지 않는다.
      - name: Build and plan shards
        id: build
        run: |
          mise exec -- tuist test \
            --build-only \
            --shard-total 2 \
            --shard-granularity suite \
            -- \
            -derivedDataPath "$CI_DERIVED_DATA"

      - name: Clean build DerivedData
        if: always()
        run: rm -rf "$CI_DERIVED_DATA"

  test-shards:
    name: Test shard ${{ matrix.shard }}
    needs: build-shards
    if: toJSON(fromJSON(needs.build-shards.outputs.matrix).shard) != '[]'
    runs-on: self-hosted
    timeout-minutes: 60

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-shards.outputs.matrix) }}

    env:
      TUIST_SHARD_INDEX: ${{ matrix.shard }}
      TUIST_SHARD_PLAN_ID: ${{ matrix.shard_plan_id }}
      CI_DERIVED_DATA: ${{ runner.temp }}/DDDAttendance-shard-test-${{ github.run_id }}-${{ matrix.shard }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install Tuist
        run: mise install tuist

      - name: Setup Tuist insights
        run: mise exec -- tuist setup insights

      # 빌드 단계가 업로드한 테스트 산출물을 받아 이 샤드에 배정된 테스트만 실행한다.
      - name: Run shard
        run: |
          mise exec -- tuist test \
            --without-building \
            -- \
            -derivedDataPath "$CI_DERIVED_DATA"

      - name: Clean shard DerivedData
        if: always()
        run: rm -rf "$CI_DERIVED_DATA"
