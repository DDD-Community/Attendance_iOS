name: TDD Automation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [feature/**, fix/**, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  FASTLANE_SKIP_UPDATE_CHECK: true
  FASTLANE_OPT_OUT_USAGE: true

jobs:
  tdd-automation:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Setup mise (for Tuist)
      uses: jdx/mise-action@v2

    - name: Install Tuist via mise
      run: |
        mise install tuist
        echo "Tuist version: $(tuist version)"

    - name: Cache Tuist
      uses: actions/cache@v4
      with:
        path: |
          ~/.tuist
          Tuist/.build
        key: ${{ runner.os }}-tuist-${{ hashFiles('**/Tuist.swift', '**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-tuist-

    - name: Setup TDD Environment
      env:
        TUIST_TOKEN: ${{ secrets.TUIST_TOKEN }}
        CI: true
        TUIST_STATS_OPT_OUT: 1
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        REVERSED_CLIENT_ID: ${{ secrets.REVERSED_CLIENT_ID }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
      run: |
        echo "🚀 Setting up TDD Automation Environment"

        # Create required Config files for CI
        mkdir -p Config
        echo "📝 Creating Config files for TDD automation..."

        # Create Shared.xcconfig
        cat > Config/Shared.xcconfig << 'EOF'
        // Shared.xcconfig - Auto-generated for CI TDD
        MARKETING_VERSION=1.0.0
        CURRENT_PROJECT_VERSION=1
        EOF

        # Create Dev.xcconfig
        cat > Config/Dev.xcconfig << 'EOF'
        // Dev.xcconfig - Auto-generated for CI TDD
        #include "./Shared.xcconfig"

        OTHER_SWIFT_FLAGS[config=STAGE][sdk=*] = $(inherited) -DDEBUG
        SWIFT_ACTIVE_COMPILATION_CONDITIONS = STAGE
        BUNDLE_DISPLAY_NAME = DDD
        BASE_URL = api.dddstudy.site/
        GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-placeholder}
        GOOGLE_IOS_CLIENT_ID=${GOOGLE_IOS_CLIENT_ID:-placeholder}
        REVERSED_CLIENT_ID=${REVERSED_CLIENT_ID:-placeholder}
        EOF

        # Create other config files
        cp Config/Dev.xcconfig Config/Stage.xcconfig
        cp Config/Dev.xcconfig Config/Release.xcconfig
        cp Config/Dev.xcconfig Config/Prod.xcconfig

        echo "✅ Config files created for TDD automation"

    - name: Compile TDD Automation Tool
      run: |
        echo "🔨 Compiling TDD automation tool..."
        swiftc TuistTool.swift -o make
        chmod +x make
        echo "✅ TDD automation tool compiled successfully"

    - name: Run TDD Automation
      id: tdd_automation
      run: |
        echo "🚀 Starting TDD Automation..."
        ./make tdd-auto 2>&1 | tee tdd_output.log
        echo "✅ TDD Automation completed"

    - name: Check Generated Tests
      run: |
        echo "📊 Checking generated test files..."
        find Projects/Domain/Entity/EntityTests/Sources -name "*.swift" -type f | head -10

        echo "📝 Test file count by domain:"
        for domain in Attendance Auth Profile; do
          count=$(find Projects/Domain/Entity/EntityTests/Sources/$domain -name "*Test.swift" 2>/dev/null | wc -l || echo "0")
          echo "  $domain: $count test files"
        done

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tdd-automation-results-${{ github.sha }}
        path: |
          Projects/Domain/Entity/EntityTests/Sources/**/*Test.swift
          tdd_output.log
          TestResults.xcresult

    - name: Comment TDD Results on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          let comment = "## 🤖 TDD Automation Results\n\n";

          try {
            // Read TDD output log
            const tddOutput = fs.readFileSync('tdd_output.log', 'utf8');

            // Count generated tests
            const domains = ['Attendance', 'Auth', 'Profile'];
            let testCount = 0;

            for (const domain of domains) {
              try {
                const files = fs.readdirSync(`Projects/Domain/Entity/EntityTests/Sources/${domain}`);
                const testFiles = files.filter(f => f.endsWith('Test.swift'));
                testCount += testFiles.length;
                comment += `✅ **${domain}**: ${testFiles.length} test files\n`;
              } catch (e) {
                comment += `❌ **${domain}**: No tests generated\n`;
              }
            }

            comment += `\n📊 **Total**: ${testCount} test files generated\n\n`;

            comment += "🎯 **TDD Automation Features:**\n";
            comment += "- ✅ Mock 데이터 기반 자동 테스트 생성\n";
            comment += "- ✅ Swift Testing (@Test) 형식 사용\n";
            comment += "- ✅ 도메인별 테스트 커버리지\n";
            comment += "- ✅ 자동 워크스페이스 생성\n\n";

            if (tddOutput.includes("✅ TDD 자동화 완료")) {
              comment += "🎉 **Status**: TDD 자동화 성공적으로 완료!\n";
            } else {
              comment += "⚠️ **Status**: TDD 자동화 부분 완료\n";
            }

            comment += "\n🚀 **Usage**: `./make tdd-auto`";

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

          } catch (error) {
            console.error('Error creating comment:', error);
          }